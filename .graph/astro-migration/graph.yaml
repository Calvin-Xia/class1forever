label: Astro+Workers 迁移
entry:
  description: >-
    现站是静态 HTML5 + Cloudflare Pages Functions + KV，线上由 Pages 绑定 main 自动部署；需要在不削弱公开数据、口令详情、地图交互、可达性与视觉身份的前提下，把它迁移为 Astro 6
    SSR（@astrojs/cloudflare）+ ECharts + TypeScript/React 岛屿的新站，部署面改为 Cloudflare Workers Assets，KV 绑定 CLASS_MAP_DATA
    与两个数据键沿用。
  defined_by: human
  level: 0
exit:
  description: >-
    分支 astro-migration 上存在可构建、可本地运行、可预览部署的新站：四个 API 路由行为逐字段等价，等价性清单逐条复跑通过，构建与静态安全门禁全绿，切换包与人工作业清单交付；生产域名切换与 Pages
    下线由人工执行。
  acceptance_criteria:
    - npm run build 退出码 0，且其中包含类型检查、四项静态安全断言与对比度同值断言；注入违规（例如页面引用学生明细数据文件）时构建失败
    - '四个 API 路由在新站可用，响应字段、状态码、Vary: Cookie 与口令限流阈值与旧站逐条对照一致，对照记录留档'
    - 14 项人工 smoke 在新站逐条复跑通过并有证据，其中分享图范围与日期、触摸长按下钻、弹窗 inert 与焦点归还、480px 无横向滚动均在案
    - wrangler 预览部署成功且首页与四个路由可用；生产 Pages 与域名未被 agent 修改，KV 两个数据键未被改写
    - 图中全部 task 节点为 passed，图校验 0 error，交叉复核签署在案
  defined_by: human
  level: 0
