plan:
  description: >-
    收口 l2_dialogs 上报的两处跨岛屿契约缺口。(1) 功能回归：旧站底部抽屉的「进入 X
    地图详情」按钮走独立下钻入口，不受详情模式门禁；新站的地区激活入口在详情模式开启时不执行下钻，导致该按钮只重画明细卡、下钻不了。修法：在地图岛屿模块暴露只读的下钻入口（导出下钻函数，或给地区激活入口加 intent:'drill'
    参数），抽屉岛屿的对应回调改用它——不得复制第二条下钻分支，一览/地图点击仍走地区激活入口。(2) 事件契约：跨岛屿桥的 MAP_EVENT_NAMES 只列 5 个，但地图岛屿还广播 map:escape、事件桥广播
    map:detail-mode-change 两个字面量事件；补齐这两个常量并让消费方改用常量订阅。范围：地图岛屿模块、跨岛屿桥模块、抽屉岛屿模块；不改其它行为语义。
