  notes: >-
    【选型说明】下钻入口选了「给 `activateRegion` 加 `intent` 参数」而不是「导出 `drillIntoProvince`」：

    · 理由：`activateRegion` 已经是旧站唯一的地区激活入口，门禁（`drilldownFile` + `!isActiveProvinceView()`）也已经在它内部；再导出一个
    `drillIntoProvince` 会让抽屉侧也持有一份「能不能下钻」的判断，两处迟早漂移。加 intent
    只多一个参数，守卫仍只有一份，且「不可下钻时静默返回」的旧站语义（handleDrilldownClick）能在同一处表达。

    · 具体：`export type RegionActivationIntent = 'auto' | 'drill'`；`activateRegion(point, source='external',
    intent='auto')`。`intent==='drill'` → 可下钻就 `drillIntoProvince`，不可下钻直接返回（不广播 region-activate，避免把抽屉又打开一遍）；`auto`
    分支逻辑与改动前逐字一致（详情模式关闭且可下钻 → 下钻，否则广播 region-activate）。抽屉侧只改一行：`activateRegion(point, 'sheet', 'drill')`。

    · 无第二条下钻分支：下钻仍只有 `drillIntoProvince` 一处调用点由 intent 选择；一览（region-ledger → `activate:` 回调）与地图点击（TapFallback / zrender
    click）都仍走 `activateRegion` 默认 auto。


