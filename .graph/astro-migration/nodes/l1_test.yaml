    【第 ④ 点结论（主控需要知道的风险判断）】旧前端 `js/map.js:851` 的 `fetchJson` 只设 `credentials:'same-origin'`，logout 调用（js/map.js:740）是
    `fetchJson('/api/auth/logout', { method: 'POST' })`，确实不带 Content-Type。依据 Astro 6.4.8 源码
    `node_modules/astro/dist/core/app/middlewares.js`（`createOriginCheckMiddleware`）：非 GET/HEAD/OPTIONS 请求，若**没有**
    Content-Type，则要求 `request.headers.get('origin') === url.origin`，否则 403；若有 Content-Type
    且是表单类（application/x-www-form-urlencoded、multipart/form-data、text/plain）同样要求同源；JSON 这类非表单 Content-Type
    不检查。关键问题是浏览器会不会带 Origin —— 我做了真浏览器实测（Playwright/Chromium 155，页面
    http://127.0.0.1:8908，就是同源页面里执行旧前端那两行调用）：`fetch('/api/auth/logout', { method: 'POST' })` → **200
    `{"authenticated":false}`**，`fetch('/api/auth/details', {method:'POST', headers:{'Content-Type':'application/json;
    charset=utf-8'}, body:…})` → **200 `{"authenticated":true}`**，`GET /api/map/public` → 200，且 `Set-Cookie` 在 JS
    里读不到（null，HttpOnly 生效）。由源码规则反推：那个裸 POST 被放行，只可能是浏览器确实带上了 `Origin: http://127.0.0.1:8908`（Fetch 规范对非 GET/HEAD 请求附加
    Origin；现代浏览器对同源 POST 同样发送）。**结论：不是生产回归**——浏览器用户（含旧前端那份代码）会正常 200、登出会清会话；会被 403 的只有不发 Origin 的非浏览器调用方（curl、Node
    脚本、我们的测试），这正是 checkOrigin 想挡的跨站表单提交，属有意的安全改进。因此不要把 F-1 当缺陷修，也不要关掉 checkOrigin；只需（已做）在 README/DEPLOYMENT 写明：浏览器自动带
    Origin，curl/脚本联调要手动加 `-H "Origin: <站点源>"`。

