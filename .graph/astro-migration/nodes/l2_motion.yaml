      HTML（源码：node_modules/astro/dist/core/build/plugins/plugin-scripts.js 的 shouldInlineAsset 分支 +
      runtime/server/render/script.js）。我这边已用动态 import 把动效层改成外链（不再内联），但**页面里仍有两个内联脚本**（Astro 的 island 引导 runtime，来自地图岛的
      client:* 指令），真浏览器实测：Chromium 控制台报 2 条 `Executing inline script violates ... 'script-src 'self'' ... blocked`，hash
      分别是 sha256-eIXWvAmxkr251LJZkjniEK5LcPF3NkapbJepohwYRIc= 与 sha256-SaCkFfPruIdTXT8/97JArQmGxiJAL2o4bBDvSgJ5y3Q= ——
