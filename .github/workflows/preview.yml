name: Preview

# PR 预览（方案 A）。与 ci.yml 是两条独立链路，刻意做了几件"不碰生产"的隔离：
#   - 只对**同仓** PR 跑：fork 的 PR 拿不到 secrets，且这个 job 会拿部署凭据执行 PR 里的代码
#     （npm ci / build 都会跑 PR 内容），所以不允许外部代码进这个 job。
#   - 用**独立预览 worker** `class1forever-preview` + **独立预览 KV** `2761c656…`，数据是
#     `scripts/local-runtime.mjs` 的 demo 合成夹具（口令 demo），与生产 KV 完全无关。
#   - `wrangler versions upload` **只上传一个版本**，不改任何流量：不部署生产 worker、
#     不动生产 KV、不改 DNS。生产发布仍然只走 deploy.yml 的人工门禁。
#   - preview-runtime 在写预览配置前会断言"不含生产 KV id / kv_namespaces 只有 CLASS_MAP_DATA"，
#     手滑把生产 id 写进预览链路会直接失败退出（而非静默读写生产数据）。
on:
  pull_request:
    types: [opened, synchronize, reopened]

# 只读仓库内容 + 写 PR 评论（发预览地址的粘性评论）。
permissions:
  contents: read
  pull-requests: write

# 同一个 PR 只保留最新一次预览；新 push 直接取消上一轮。
concurrency:
  group: classmap-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # 只跑同仓 PR 的分支（同仓 = secrets 可用；fork PR 直接跳过而不是失败）。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 部署凭据**只挂到真正需要它的两步**（seed / upload），与 deploy.yml 的
    # "Build/test/package steps never receive deployment credentials" 同一纪律：
    # npm ci 与 npm run build 跑的是 PR 里的代码，那两步的 env 里不能有 token。
    env:
      NO_COLOR: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # demo 合成夹具（FIXTURE_STUDENTS）写进**预览**命名空间；脚本不读 js/data.js，
      # 所以真实名单不可能经这条路进预览。
      - name: Seed preview KV with demo fixtures
        env:
          # 推荐单独建一个只授权 `class1forever-preview` + 预览 KV 的 token
          # （CLOUDFLARE_PREVIEW_API_TOKEN）；没有时才回退到通用 token。
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run seed:preview

      # 上传一个预览版本并抓取 PREVIEW_URL= 那一行（脚本最后单独打印，便于这里解析）。
      - name: Upload preview version
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          output="$(npm run preview:upload -- --alias "pr-${PR_NUMBER}" --tag "pr-${PR_NUMBER}")"
          printf '%s\n' "$output"
          url="$(printf '%s\n' "$output" | sed -n 's/^PREVIEW_URL=//p' | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::preview-runtime 没有输出 PREVIEW_URL 行"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 粘性评论：同一 PR 复用同一条评论（先按 marker 找、有就 PATCH，没有才 POST）。
      - name: Upsert sticky preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          body="$(printf '%s\n\n%s\n' '<!-- classmap-preview -->' "预览地址：${PREVIEW_URL}")"
          comment_id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- classmap-preview -->")) | .id' | tail -n 1)"
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="$body" > /dev/null
            echo "已更新预览评论 #${comment_id}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
            echo "已创建预览评论"
          fi
