name: CI

# Actions 钉在 v4 tag 当前指向的提交上（2026-10-16 用
# `git ls-remote https://github.com/actions/<repo>.git refs/tags/v4` 取得；三个仓库的 v4
# 都是轻量 tag，取到的即 commit SHA）。tag 会移动，SHA 不会。
on:
  push:
  pull_request:

# 只读：CI 不写仓库、不发布。
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # 门禁含 astro build 与一次真实 wrangler dev；超时上限防止挂死的进程占住 runner。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # astro 6 的 engines 要求 node >= 22.12.0（wrangler >= 22.0.0），
          # 所以这里用 24，不再用 node 20。
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 单一门禁入口：node build.js = 静态安全断言（明细数据不外流、脚本同源无内联、
      # 省份白名单与 js/province 一致、script-src 无 unsafe-inline、对比度/调色板同值、
      # ADR-0002 的 vendor 退役、_headers 与 security-headers.ts 防漂移、Node engines 匹配、
      # 以及 `wrangler types --check`（生成类型 worker-configuration.d.ts 必须已提交且
      # 与 wrangler.jsonc 一致 —— 官方建法：提交生成类型，CI 用 --check 防漂移））
      # + astro check + astro build + 产物扫描（dist 无 .dev.vars / 无密钥字面量）。
      - name: Build and static safety gates
        run: npm run build

      # 真起一次本地 Worker（无 Cloudflare 凭据）：渲染页脚本全外链、文档响应与静态资产的
      # 安全头逐条一致、/.dev.vars 等路径不可请求。
      - name: Runtime gates (headless Worker)
        run: npm run check:runtime

      # 四路由契约断言：脚本自己起 wrangler dev（本地 KV + 演示口令），
      # 不读 .dev.vars，也不需要 Cloudflare 凭据。
      - name: API contract tests
        run: npm run test:api

      # 真浏览器手势语义回归：轻点下钻；长按 / 右键 / 轻点台湾开面板且**保持打开**；
      # 「地区一览」键盘等价。这类缺陷只在真 Chromium 的
      # 「触摸事件 → 浏览器合成鼠标事件 → click」时序里出现。
      # Playwright 的浏览器二进制不进 npm 依赖，所以在这一步单独装
      # （--with-deps 会把 Ubuntu 需要的系统库一起装上）。
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Touch gesture regression (real Chromium)
        run: npm run test:touch

      - name: EdgeOne static target and application contracts
        run: npm run check:edgeone

      - name: Same-host sessions and GeoDNS preflight negative controls
        run: npm run test:geodns && npm run test:session

      - name: Production ordering, retained chunks and artifact scans
        run: npm run check:dual:assets && npm run test:production

      - name: Syntax check
        run: |
          set -e
          # 退役的旧站资产（js/、functions/ 等）会按 task-4 的 legacy 迁移移出仓库根：
          # 目录不存在时跳过而不是让 `find` 报错 —— 语法扫描不该因为「目录已归档」而变红。
          for directory in js shared scripts tests; do
            [ -d "$directory" ] || continue
            for file in $(find "$directory" -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) ! -path 'js/vendor/*'); do
              node --check "$file"
            done
          done
          # Pages Functions 的旧路由是 ESM 语法的 .js，用 --input-type=module 校验；
          # 目录缺失（已归档到 legacy/）时同样跳过。
          if [ -d functions ]; then
            for file in $(find functions -type f \( -name '*.js' -o -name '*.mjs' \)); do
              cat "$file" | node --check --input-type=module
            done
          fi
          node --check build.js
