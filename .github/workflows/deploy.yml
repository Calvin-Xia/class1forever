name: Deploy (Cloudflare Workers + EdgeOne Makers)

# Actions 钉在 v4 tag 当前指向的提交上（2026-10-16 用
# `git ls-remote https://github.com/actions/<repo>.git refs/tags/v4` 取得；三个仓库的 v4
# 都是轻量 tag，取到的即 commit SHA）。tag 会移动，SHA 不会。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt the compatibility -> CF -> final EO sequence.
concurrency:
  group: classmap-dual-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 六阶段是串行的非原子切换（EO 兼容 → CF → EO 正式），每阶段都带真实网络读回与逐字节
    # 校验；30 分钟会把慢 runner 上的正常流程截断在中间、留下半完成状态，所以放宽到 60。
    # 单条 CLI 自身仍有 240s 上限（production-deploy.mjs runCli 的 timeout），这里给整条链留余量。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # 与 CI / 预览一致，使用已修复 CVE-2026-111497 的安全版本。
          node-version: '24.22.1'
          cache: npm
      - name: Diagnose public transport from this runner
        run: node scripts/production-deploy.mjs diagnose
      - run: npm ci
      # Build/test/package steps never receive deployment credentials.
      - name: Verify both platforms and shared public chunks
        run: npm run check:dual
      - name: Install pinned Makers CLI
        # 可复现安装：`config/edgeone-cli/` 提交了 package.json + package-lock.json（edgeone 1.6.41
        # 与全部传递依赖的 resolved/integrity 都在里面），npm ci 只按这份 lockfile 装，逐字节可复现。
        # 安装目录仍是生成目录 `.edgeone-build/cli`（gitignore，build:edgeone 会整目录重建），
        # 所以只把 lockfile 复制过去，node_modules 不落到受版本控制的位置。
        # `--ignore-scripts` 已实测安全：edgeone@1.6.41 的已发布 package.json 没有
        # preinstall/install/postinstall（`npm view edgeone@1.6.41 scripts`），用它安装后
        # `node_modules/edgeone/edgeone-dist/cli.js makers build` 能正常启动并进入构建器插件。
        # 本步骤不接触任何部署 Token（只用 npm registry），因此 Token 没有新的暴露面。
        run: |
          set -euo pipefail
          install_dir="$PWD/.edgeone-build/cli"
          mkdir -p "$install_dir"
          cp config/edgeone-cli/package.json config/edgeone-cli/package-lock.json "$install_dir/"
          npm ci --prefix "$install_dir" --no-audit --no-fund --ignore-scripts
      - name: Skip a superseded main commit before touching production
        id: current
        shell: bash
        run: |
          current_sha="$(git ls-remote https://github.com/Calvin-Xia/class1forever.git refs/heads/main | cut -f1)"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'Newer main commit exists; production is untouched.'
          fi
      - name: Read current production and retain previous public chunks
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: node scripts/production-deploy.mjs prepare
      - name: Rescan retained public assets and package both EO phases
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          node build.js --artifacts-only
          export EDGEONE_CLI_ENTRY="$PWD/.edgeone-build/cli/node_modules/edgeone/edgeone-dist/cli.js"
          node scripts/build-edgeone.mjs --artifacts-only --package-cli
          node --test tests/edgeone-package.test.mjs
          node scripts/production-deploy.mjs stage-compatibility
      - name: Verify the real Makers preview before changing production
        if: steps.current.outputs.deploy == 'true'
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_CLI_ENTRY: ${{ github.workspace }}/.edgeone-build/cli/node_modules/edgeone/edgeone-dist/cli.js
        run: node scripts/production-deploy.mjs verify-preview
      - name: Publish compatibility assets, CF Worker, then final EO production
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_CLI_ENTRY: ${{ github.workspace }}/.edgeone-build/cli/node_modules/edgeone/edgeone-dist/cli.js
        run: node scripts/production-deploy.mjs deploy
      - name: Save deployment phase evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployment-result
          path: .wrangler/production/result.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
