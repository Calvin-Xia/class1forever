<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="蹭饭地图 - 金鹰 1 班同学分布图志，点击地图查看各省市的落点">
    <meta name="theme-color" content="#f7f4ec">
    <title>金鹰 1 班蹭饭地图</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/main.css">
    <link rel="preload" as="script" href="js/vendor/echarts.min.js">
    <link rel="preload" as="script" href="js/china.js">
    <script src="js/boot.js" defer></script>
</head>
<body>
    <!-- 地图脚本整体加载失败时的兜底。role=alert 让它一出现就被读屏念出来，
         标题用 p 而不是 h3：这块是全屏接管，不该参与正文的标题层级。 -->
    <div id="cdn-error" class="cdn-error" role="alert" aria-labelledby="cdn-error-title" aria-describedby="cdn-error-message" style="display: none;">
        <div class="cdn-error__content">
            <div class="cdn-error__icon" aria-hidden="true">
                <svg class="icon icon--lg" viewBox="0 0 24 24">
                    <path d="M12 3.9 3.1 19.5h17.8Z"></path>
                    <path d="M12 9.6v4.3"></path>
                    <path d="M12 17v.01"></path>
                </svg>
            </div>
            <p id="cdn-error-title" class="cdn-error__title">地图加载失败</p>
            <p id="cdn-error-message" class="cdn-error__message">无法加载地图资源，请检查网络连接后刷新页面。</p>
            <button id="cdn-error-retry" class="cdn-error__retry" type="button">重新加载</button>
        </div>
    </div>

    <div class="atmosphere" aria-hidden="true">
        <div class="atmosphere__grid"></div>
        <div class="atmosphere__grain"></div>
        <div class="atmosphere__glow"></div>
    </div>

    <div class="page-wrapper">
        <main class="page" role="main">
            <header class="page__header">
                <div class="plate">
                    <div class="plate__main">
                        <p class="plate__eyebrow">金鹰 1 班 · 同学分布图志</p>
                        <h1 class="page__title" aria-label="金鹰 1 班蹭饭地图">
                            <span aria-hidden="true"><span class="char" style="--i:0">金</span><span class="char" style="--i:1">鹰</span><span class="char char--gap" style="--i:2"> </span><span class="char" style="--i:3">1</span><span class="char char--gap" style="--i:4"> </span><span class="char" style="--i:5">班</span><span class="char" style="--i:6">蹭</span><span class="char" style="--i:7">饭</span><span class="char" style="--i:8">地</span><span class="char" style="--i:9">图</span></span>
                        </h1>
                        <p class="page__description">地图上先摊开各省市的落点与人数。姓名和学校不写在公开图面上 —— 要口令才翻得开。</p>
                    </div>

                    <aside class="plate__meta" aria-label="图幅信息">
                        <dl>
                            <div>
                                <dt>图幅</dt>
                                <dd>中华人民共和国</dd>
                            </div>
                            <div>
                                <dt>投影</dt>
                                <dd>EPSG:3415 等距</dd>
                            </div>
                            <div>
                                <dt>比例</dt>
                                <dd>不按比例 · 按饭量</dd>
                            </div>
                            <div>
                                <dt>口径</dt>
                                <dd>人数公开</dd>
                            </div>
                        </dl>
                        <span class="plate__seal" aria-hidden="true">蹭饭</span>
                    </aside>
                </div>
            </header>

            <section class="map-section" aria-label="互动地图">
                <div class="map-container">
                    <div class="map-frame">
                        <div class="map-frame__corner map-frame__corner--tl" aria-hidden="true"></div>
                        <div class="map-frame__corner map-frame__corner--tr" aria-hidden="true"></div>
                        <div class="map-frame__corner map-frame__corner--bl" aria-hidden="true"></div>
                        <div class="map-frame__corner map-frame__corner--br" aria-hidden="true"></div>

                        <div class="map-toolbar">
                            <button id="map-back-btn" class="chip map-back-btn" type="button" hidden>
                                <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M19.4 12H4.6"></path>
                                    <path d="m10.8 5.8-6.2 6.2 6.2 6.2"></path>
                                </svg>
                                <span>返回全国</span>
                            </button>
                            <button id="details-btn" class="chip details-btn" type="button" aria-label="开启查看详情模式" aria-pressed="false">同学信息</button>
                            <span id="map-region-badge" class="chip map-region-badge">中国</span>
                        </div>

                        <button id="share-btn" class="share-btn magnet spotlight" type="button" title="保存分享图" aria-label="保存分享图">
                            <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 3.6v10.6"></path>
                                <path d="m7.4 9.6 4.6 4.6 4.6-4.6"></path>
                                <path d="M3.9 16.8v1.6a2.1 2.1 0 0 0 2.1 2.1h12a2.1 2.1 0 0 0 2.1-2.1v-1.6"></path>
                            </svg>
                        </button>

                        <div class="map-zoom" role="group" aria-label="地图缩放">
                            <button id="map-zoom-in" class="map-zoom__btn" type="button" aria-label="放大地图" title="放大">
                                <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M12 5.2v13.6"></path>
                                    <path d="M5.2 12h13.6"></path>
                                </svg>
                            </button>
                            <button id="map-zoom-out" class="map-zoom__btn" type="button" aria-label="缩小地图" title="缩小">
                                <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M5.2 12h13.6"></path>
                                </svg>
                            </button>
                            <button id="map-zoom-reset" class="map-zoom__btn" type="button" aria-label="重置地图缩放，回到铺满视图" title="重置视图">
                                <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M9.6 3.8H5.2a1.4 1.4 0 0 0-1.4 1.4v4.4"></path>
                                    <path d="M14.4 3.8h4.4a1.4 1.4 0 0 1 1.4 1.4v4.4"></path>
                                    <path d="M9.6 20.2H5.2a1.4 1.4 0 0 1-1.4-1.4v-4.4"></path>
                                    <path d="M14.4 20.2h4.4a1.4 1.4 0 0 0 1.4-1.4v-4.4"></path>
                                </svg>
                            </button>
                        </div>

                        <div class="map-scale" aria-hidden="true">
                            <span class="map-scale__bar"></span>
                            <span class="map-scale__label">200 km</span>
                        </div>

                        <!-- role=img 里的内容对读屏是纯装饰，加载文案读不出来；
                             busy 状态靠 aria-busy 与页脚那条 role=status 的播报承担。 -->
                        <div id="map" role="img" aria-label="中国地图，显示同学分布" aria-busy="true" tabindex="-1">
                            <div id="map-loading" class="map-loading">
                                <div class="map-loading__spinner"></div>
                                <p class="map-loading__text">正在展开图面…</p>
                            </div>
                        </div>

                        <a href="https://echarts.apache.org" target="_blank" rel="noopener noreferrer" class="map-credit">Apache ECharts</a>
                    </div>
                </div>
            </section>

            <!-- 图表画在 canvas 上，地区和城市无法聚焦。这张表是键盘与读屏的替代路径，
                 每行一个按钮，行为和在地图上点击该地区完全一致。 -->
            <details class="region-ledger" id="region-ledger">
                <summary class="region-ledger__summary">
                    <h2 class="region-ledger__title">地区一览</h2>
                    <svg class="icon icon--xs region-ledger__chevron" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m9.8 5.8 6.2 6.2-6.2 6.2"></path>
                    </svg>
                </summary>
                <div class="region-ledger__body">
                    <div class="region-ledger__controls">
                        <p class="region-ledger__note" id="region-ledger-note"></p>
                        <button id="region-sort-btn" class="chip region-ledger__sort" type="button" aria-label="当前按人数排序，点击改为按地区名排序">按人数</button>
                    </div>
                    <table class="region-table">
                        <caption class="visually-hidden">各地区公开人数一览。每一行都有一个按钮，作用和在地图上点击该地区相同。</caption>
                        <thead>
                            <tr>
                                <th scope="col" id="region-th-name" aria-sort="none">地区</th>
                                <th scope="col" id="region-th-count" class="region-table__num" aria-sort="descending">人数</th>
                                <th scope="col" class="region-table__num">城市</th>
                                <th scope="col"><span class="visually-hidden">操作</span></th>
                            </tr>
                        </thead>
                        <tbody id="region-table-body"></tbody>
                    </table>
                </div>
            </details>
        </main>

        <footer class="page__footer">
            <div class="note-container" id="interaction-note" aria-live="polite" role="status"></div>
        </footer>
    </div>

    <div id="bs-overlay" class="bottom-sheet-overlay"></div>

    <div id="bottom-sheet" class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="bs-title" tabindex="-1">
        <div class="bs-header">
            <h2 id="bs-title" class="bs-header__title">地区详情</h2>
            <button id="bs-close" class="bs-close" type="button" aria-label="关闭地区详情" hidden>
                <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.6 6.6 17.4 17.4"></path>
                    <path d="M17.4 6.6 6.6 17.4"></path>
                </svg>
            </button>
        </div>
        <div class="bs-content" id="bs-content"></div>
        <div class="bs-footer">
            <button id="bs-primary-btn" class="bs-btn bs-btn--secondary spotlight" type="button" hidden>查看详情</button>
            <button id="bs-drilldown-btn" class="bs-btn magnet spotlight" type="button" hidden>进入地图详情</button>
        </div>
    </div>

    <div id="auth-overlay" class="auth-overlay" hidden>
        <div class="auth-modal" role="dialog" aria-modal="true" aria-labelledby="auth-title">
            <button id="auth-close" class="auth-modal__close" type="button" aria-label="关闭">
                <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6.6 6.6 17.4 17.4"></path>
                    <path d="M17.4 6.6 6.6 17.4"></path>
                </svg>
            </button>
            <h2 id="auth-title" class="auth-modal__title">查看详情</h2>
            <p class="auth-modal__description">地图上先摊开各地人数。输入口令后，才能按地区翻到姓名和学校。</p>
            <p id="auth-hint" class="auth-modal__hint"></p>
            <form id="auth-form" class="auth-modal__form">
                <!-- 这里没有账号概念，但密码管理器需要一个"用户名"才能把口令存下来。
                     给个固定上下文值，浏览器就不会再提示缺少用户名字段，
                     保存下来的口令也能说明是哪一个站点的。 -->
                <input type="text" class="visually-hidden" name="username" autocomplete="username" tabindex="-1" aria-hidden="true" value="金鹰 1 班">
                <label class="auth-modal__label" for="auth-passphrase">查看口令</label>
                <div class="auth-modal__field">
                    <input id="auth-passphrase" class="auth-modal__input" type="password" autocomplete="current-password" placeholder="输入口令" aria-describedby="auth-hint">
                    <button id="auth-toggle" class="auth-modal__toggle" type="button" aria-pressed="false" aria-label="显示口令">
                        <svg class="icon icon--md" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2.8 12C4.9 7.7 8.2 5.7 12 5.7s7.1 2 9.2 6.3c-2.1 4.3-5.4 6.3-9.2 6.3S4.9 16.3 2.8 12Z"></path>
                            <circle cx="12" cy="12" r="2.9"></circle>
                            <!-- 显隐状态不能只靠颜色：口令显示时加一道斜杠 -->
                            <path class="auth-modal__toggle-slash" d="M4.8 19.2 19.2 4.8"></path>
                        </svg>
                    </button>
                </div>
                <p id="auth-feedback" class="auth-modal__feedback" aria-live="polite"></p>
                <button id="auth-submit" class="auth-modal__submit" type="submit">进入查看</button>
            </form>
        </div>
    </div>
</body>
</html>
